name: Community Bot Automation

on:
  schedule:
    # 30분마다 주기적 실행 (UTC 기준)
    - cron: '*/30 * * * *'
  # 깃허브 웹에서 버튼 눌러 수동 실행 허용
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Crawler Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_REDDIT: ${{ secrets.TOPIC_ID_REDDIT }}
          TOPIC_ID_DC: ${{ secrets.TOPIC_ID_DC }}
          SUBREDDIT: ${{ secrets.SUBREDDIT }}
          GALLERY_ID: ${{ secrets.GALLERY_ID }}
        run: python main.py

      - name: Commit and Push History
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sent_combined_history.txt || true
          git commit -m "Update sent posts history" || true
          git push || true
