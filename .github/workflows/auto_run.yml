name: Wonhee Thief Bot Cron

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 자동 실행
  workflow_dispatch:         # 👈 깃허브 웹 화면에서 버튼 눌러 실행 가능하게 만드는 핵심 설정!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dotenv

      - name: 봇 실행
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID_REDDIT: ${{ secrets.TOPIC_ID_REDDIT }}
          TOPIC_ID_DC: ${{ secrets.TOPIC_ID_DC }}
          SUBREDDIT: ${{ secrets.SUBREDDIT }}
          GALLERY_ID: ${{ secrets.GALLERY_ID }}
        run: python main.py

      - name: 전송 기록(히스토리) 깃허브에 저장 (중복 전송 방지)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_combined_history.txt
          git commit -m "Update sent history" || exit 0
          git push
